name: Échéances datées

# Une échéance datée = une issue `[AAAA-MM-JJ] geste` portant le label `échéance`
# (décision du 21/10/2026). Ce job signale chaque jour celles dont la date est venue.
# Un marqueur HTML caché dans le commentaire évite de relancer deux fois la même date ;
# changer la date du titre déclenche un nouveau rappel. Il ne ferme ni ne modifie rien.
on:
  schedule:
    - cron: "7 5 * * *"   # tous les jours, 05:07 UTC
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  rappeler:
    name: Signaler les échéances atteintes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Commenter les échéances atteintes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          aujourdhui=$(date -u +%F)
          gh issue list --label "échéance" --state open --limit 1000 \
            --json number,title \
            --jq '.[] | select(.title | test("^\\[[0-9]{4}-[0-9]{2}-[0-9]{2}\\]")) | "\(.number)\t\(.title[1:11])"' \
            | while IFS=$'\t' read -r numero date; do
                [[ "$date" > "$aujourdhui" ]] && continue
                marqueur="<!-- echeance-rappel:${date} -->"
                commentaires=$(gh api --paginate "repos/${GH_REPO}/issues/${numero}/comments" --jq '.[].body')
                if grep -qF -- "$marqueur" <<< "$commentaires"; then
                  echo "#${numero} : rappel du ${date} déjà posté"
                  continue
                fi
                gh issue comment "$numero" --body "${marqueur}
          @AlexisLaporte échéance du ${date} atteinte : ce geste est à traiter."
                echo "#${numero} : rappel du ${date} posté"
              done
